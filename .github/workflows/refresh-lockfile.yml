name: Refresh lockfile

# For a machine that cannot reach the registry: resolve the lockfile here and push it to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --mode=update-lockfile
      - name: Push the resolved lockfile
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git diff --cached --quiet && { echo "lockfile already current"; exit 0; }
          git commit -m "Resolve the lockfile for the published SDK"
          git push origin "HEAD:$BRANCH"
