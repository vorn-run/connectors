name: Release

# Tagged per connector — `ado-v0.2.0` publishes only that package. A connector
# releasing on its own schedule is the whole reason these live outside the app.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --immutable

      - name: Resolve the package from the tag
        id: pkg
        run: |
          name="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          echo "dir=packages/$name" >> "$GITHUB_OUTPUT"
          echo "workspace=$(node -p "require('./packages/$name/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version"

      - name: Check the tag matches the package
        run: |
          declared=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$declared" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.pkg.outputs.version }} but package.json says $declared"
            exit 1
          fi

      # The gate CI runs on every pull request, run again here against the
      # exact commit being published. A tag can point at any commit, including
      # one that never sat on main, and npm publishes are not retractable after
      # 72 hours.
      #
      # `yarn build` comes before the catalog check on purpose: that check
      # imports each package's built dist/ to read its manifest, so on a fresh
      # checkout it fails with "packages/ado is not built" rather than telling
      # you anything about the catalog. Every workspace is built, not just the
      # one being released, because the check reads all five.
      - run: yarn typecheck
      - run: yarn workspace ${{ steps.pkg.outputs.workspace }} run test
      - run: yarn build
      - run: node scripts/build-catalog.mjs --check

      # The release notes come from the package's own CHANGELOG.md, read
      # between this version's heading and the next one. Autogenerated commit
      # lists describe what a developer did; this describes what changed for
      # the person installing it.
      #
      # The notes are written to a file rather than a step output, and every
      # value below arrives through env: rather than ${{ }} interpolation.
      # GitHub pastes an interpolated expression into the script as literal
      # text before bash sees it, so a changelog line mentioning a command in
      # backticks becomes a command substitution that actually runs — that is
      # how `gh auth login` in the GitHub connector's notes executed `gh` and
      # published its help output as the release body. A changelog is ordinary
      # prose from the repository; it must never reach a shell as code.
      - name: Take the notes from the changelog
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          changelog="$PKG_DIR/CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "::error::$changelog does not exist — a release needs notes"
            exit 1
          fi
          awk -v v="## $VERSION" '
            $0 == v      { grab = 1; next }
            grab && /^## / { exit }
            grab         { print }
          ' "$changelog" > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::$changelog has no '## $VERSION' section"
            exit 1
          fi

      # `yarn build` above already built this package along with the rest, so
      # what ships is the artifact the catalog check just read rather than a
      # second, later build of the same source.
      - run: yarn npm publish --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After the publish, deliberately. A release pointing at a version npm
      # does not have is worse than a publish with no release: the first sends
      # people to an install that fails, the second is merely undocumented.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE: ${{ steps.pkg.outputs.workspace }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          {
            echo
            echo '---'
            echo "Install: \`npx -y $WORKSPACE\`"
            echo "npm: https://www.npmjs.com/package/$WORKSPACE/v/$VERSION"
          } >> release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$WORKSPACE $VERSION" \
            --notes-file release-notes.md
