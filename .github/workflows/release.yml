name: Release

# Tagged per connector — `ado-v0.2.0` publishes only that package. A connector
# releasing on its own schedule is the whole reason these live outside the app.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --immutable

      - name: Resolve the package from the tag
        id: pkg
        run: |
          name="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          echo "dir=packages/$name" >> "$GITHUB_OUTPUT"
          echo "workspace=$(node -p "require('./packages/$name/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version"

      - name: Check the tag matches the package
        run: |
          declared=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$declared" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.pkg.outputs.version }} but package.json says $declared"
            exit 1
          fi

      # The gate CI runs on every pull request, run again here against the
      # exact commit being published. A tag can point at any commit, including
      # one that never sat on main, and npm publishes are not retractable after
      # 72 hours.
      - run: yarn typecheck
      - run: yarn workspace ${{ steps.pkg.outputs.workspace }} run test
      - run: node scripts/build-catalog.mjs --check

      # The release notes come from the package's own CHANGELOG.md, read
      # between this version's heading and the next one. Autogenerated commit
      # lists describe what a developer did; this describes what changed for
      # the person installing it.
      - name: Take the notes from the changelog
        id: notes
        run: |
          changelog="${{ steps.pkg.outputs.dir }}/CHANGELOG.md"
          version="${{ steps.pkg.outputs.version }}"
          if [ ! -f "$changelog" ]; then
            echo "::error::$changelog does not exist — a release needs notes"
            exit 1
          fi
          body=$(awk -v v="## $version" '
            $0 == v      { grab = 1; next }
            grab && /^## / { exit }
            grab         { print }
          ' "$changelog")
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "::error::$changelog has no '## $version' section"
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$body"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # Just this package: a connector depends on the published SDK, not on
      # another workspace, so there is no dependency graph to walk.
      - run: yarn workspace ${{ steps.pkg.outputs.workspace }} run build
      - run: yarn npm publish --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After the publish, deliberately. A release pointing at a version npm
      # does not have is worse than a publish with no release: the first sends
      # people to an install that fails, the second is merely undocumented.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.pkg.outputs.workspace }} ${{ steps.pkg.outputs.version }}" \
            --notes "${{ steps.notes.outputs.body }}
          ---
          Install: \`npx -y ${{ steps.pkg.outputs.workspace }}\`
          npm: https://www.npmjs.com/package/${{ steps.pkg.outputs.workspace }}/v/${{ steps.pkg.outputs.version }}"
